services:
  - type: web
    name: animal-race
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SERVE_STATIC
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: no-verify
      - key: SITE_NAME
        value: ZooRacing
      - key: VITE_SITE_NAME
        value: ZooRacing
      - key: VITE_GROUP_URL
        sync: false
      - key: PAYMENT_GATEWAY
        value: mercadopago
      - key: PAYMENT_CURRENCY
        value: BRL
      - key: PUBLIC_APP_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: VITE_SUPPORT_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
